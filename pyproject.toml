[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "perishables"
version = "0.1.0"
description = "Deterministic trust-claim auditor for Open Knowledge Format bundles and cross-ecosystem semantic layers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "David Engelmann" }]
keywords = [
    "okf",
    "semantic-layer",
    "dbt",
    "lookml",
    "snowflake",
    "databricks",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/david-engelmann/perishables"
Repository = "https://github.com/david-engelmann/perishables"
Documentation = "https://github.com/david-engelmann/perishables/blob/main/docs/README.md"
Changelog = "https://github.com/david-engelmann/perishables/blob/main/CHANGELOG.md"
Issues = "https://github.com/david-engelmann/perishables/issues"

[tool.maturin]
manifest-path = "crates/perishables/Cargo.toml"
bindings = "bin"
python-source = "python"
module-name = "perishables"
strip = true
include = ["LICENSE-MIT", "LICENSE-APACHE"]
