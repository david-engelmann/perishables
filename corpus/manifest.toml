# The perishables planted defect corpus manifest.
# Corpus versioning is independent of the tool version. Adding a
# fixture increments the minor version. Changing an expected result
# increments the major version and needs a written reason in the
# release notes. Each fixture directory also carries its own
# LABEL.toml with the same expectation in machine readable form.

corpus_version = "0.1.0"
as_of = "2026-11-20"
auditor_version_range = ">=0.1.0"

