name: Publish Crates

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish workspace crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Verify gates before publish
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo run --locked -- corpus
          cargo doc --workspace --no-deps --locked
      - name: Dry-run package verification
        run: |
          cargo package -p perishables-core --locked
          cargo package --list -p perishables-semantic --locked
          cargo package --list -p perishables --locked
      - name: Publish in dependency order
        if: github.event_name == 'release'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p perishables-core --locked
          sleep 20
          cargo publish -p perishables-semantic --locked
          sleep 20
          cargo publish -p perishables --locked
