name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Hygiene and Zero-Dep Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify zero external dependencies in Cargo.lock
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          lock = pathlib.Path("Cargo.lock").read_text(encoding="utf-8")
          names = re.findall(r'^name = "([^"]+)"', lock, flags=re.MULTILINE)
          allowed = {"perishables", "perishables-core", "perishables-semantic"}
          extra = sorted(set(names) - allowed)
          if extra:
              sys.stderr.write(f"External dependencies forbidden in workspace: {extra}\n")
              sys.exit(1)

          core_toml = pathlib.Path("crates/perishables-core/Cargo.toml").read_text(encoding="utf-8")
          dep_section = core_toml.split("[dependencies]", 1)[1].split("[", 1)[0].strip()
          if dep_section:
              sys.stderr.write(f"perishables-core must stay zero-dependency, found:\n{dep_section}\n")
              sys.exit(1)
          print(f"Verified zero external crates across {sorted(names)}")
          PY
      - name: Verify Markdown typography bar (no em or en dashes)
        run: |
          python3 - <<'PY'
          import pathlib, sys

          violations = []
          for md in sorted(pathlib.Path(".").rglob("*.md")):
              if ".git" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              for line_no, line in enumerate(text.splitlines(), 1):
                  if "\u2014" in line or "\u2013" in line:
                      violations.append(f"{md}:{line_no}: contains em or en dash")
          if violations:
              sys.stderr.write("\n".join(violations) + "\n")
              sys.exit(1)
          print("Zero em or en dashes across all Markdown files.")
          PY
      - name: Lint shell scripts with ShellCheck
        run: shellcheck install.sh book/sync-docs.sh examples/ci_gate_walkthrough.sh
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: Run cargo-deny supply-chain check
        run: cargo deny check

  matrix-gates:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-1.100.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.100.0-
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Compile-check out-of-workspace fuzz targets
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --bins
      - name: Run test suite
        run: cargo test --workspace --all-features --locked
      - name: Run corpus gate
        run: cargo run --locked -- corpus
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked
      - name: Run embedding example
        run: cargo run -p perishables-core --example audit_bundle --locked
      - name: Build CLI and run Python SDK test suite
        shell: bash
        run: |
          cargo build --locked -p perishables --bin perishables
          python3 -m unittest discover -s python/tests -v || python -m unittest discover -s python/tests -v
      - name: Run Python SDK and CLI gate examples
        shell: bash
        run: |
          (python3 examples/audit_and_semantic_gate.py || python examples/audit_and_semantic_gate.py)
          sh examples/ci_gate_walkthrough.sh

  gates:
    name: gates
    needs: [hygiene, matrix-gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require hygiene and all OS gates green
        run: |
          test "${{ needs.hygiene.result }}" = "success"
          test "${{ needs.matrix-gates.result }}" = "success"
